openapi: 3.0.3
info:
  title: Training Analytics API
  version: 1.0.0

paths:
  /trainings/insights:
    get:
      tags:
        - Insights
      operationId: getInsights
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingAnalysisDto"

  /strava/login:
    get:
      tags:
        - Strava
      operationId: stravaLogin
      responses:
        "302":
          description: Redirect to Strava OAuth authorization page
          headers:
            Location:
              description: Strava OAuth URL
              schema:
                type: string

  /strava/callback:
    get:
      tags:
        - Strava
      operationId: stravaCallback
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authentication successful
          content:
            text/plain:
              schema:
                type: string

  /strava/activities:
    get:
      tags:
        - Strava
      operationId: getStravaActivities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityDto"
  /strava/activities/sync:
    get:
      tags:
        - Strava
      operationId: syncStravaActivities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityDto"

components:
  schemas:
    TrainingAnalysisDto:
      type: object
      properties:
        loadLevel:
          type: string
        nextWeekRecommendation:
          type: string
        watchOut:
          type: string
        observations:
          type: array
          items:
            type: string

    ActivityDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        distance:
          type: number
          format: double
        moving_time:
          type: integer
        elapsed_time:
          type: integer
        type:
          type: string
        sport_type:
          type: string
        start_date:
          type: string
        start_date_local:
          type: string
        timezone:
          type: string
        total_elevation_gain:
          type: number
          format: double
        average_speed:
          type: number
          format: double
        max_speed:
          type: number
          format: double
        average_heartrate:
          type: number
          format: double
          nullable: true
        max_heartrate:
          type: number
          format: double
          nullable: true
        average_cadence:
          type: number
          format: double
          nullable: true
        average_watts:
          type: number
          format: double
          nullable: true
        weighted_average_watts:
          type: number
          format: double
          nullable: true
        average_temp:
          type: integer
          nullable: true
        kilojoules:
          type: number
          format: double
          nullable: true
        trainer:
          type: boolean
        commute:
          type: boolean
        achievement_count:
          type: integer
        kudos_count:
          type: integer
        suffer_score:
          type: number
          format: double
          nullable: true
        elev_high:
          type: number
          format: double
        elev_low:
          type: number
          format: double
